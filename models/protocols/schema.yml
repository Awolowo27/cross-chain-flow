version: 2

models:
  - name: flow_across_matched
    description: "Across V3 deposit and fill correlated cross-chain flows."
    columns:
      - name: correlation_id
        tests:
          - not_null
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PENDING', 'COMPLETED']
      - name: source_chain
        tests:
          - not_null

